<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>루나 첫 생일 · 행운 쿠폰</title>
<meta name="robots" content="noindex, nofollow" />
<style>
/* ═══════════════════════════════════════════
   초대장과 같은 아이보리 · 먹빛 · 낙관 홍색
   ═══════════════════════════════════════════ */
:root {
  --paper:    #FCF8F1;
  --paper-2:  #F4EDE1;
  --ink:      #332E2A;
  --ink-soft: #6B6155;
  --ink-faint:#8A7F70;
  --line:     #E2D8C8;
  --seal:     #B93A50;
  --seal-ink: #FFF6F2;
  --font-display: "Nanum Myeongjo", AppleMyungjo, "Noto Serif KR", Batang, 바탕, Georgia, serif;
  --font-body: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding: 24px 16px 60px;
  background: #E8E2D8;
  color: var(--ink);
  font-family: var(--font-body);
}
p { margin: 0; }

/* ── 화면에서만 보이는 안내 ── */
.bar {
  max-width: 297mm; margin: 0 auto 20px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 16px 18px;
  background: var(--paper); border-radius: 4px;
  font-size: .875rem; color: var(--ink-soft); line-height: 1.7;
}
.bar b { color: var(--ink); font-weight: 600; }
.bar__btn {
  appearance: none; cursor: pointer;
  margin-left: auto;
  padding: 10px 22px; border-radius: 999px;
  border: 1px solid var(--seal); background: var(--seal); color: var(--seal-ink);
  font-family: var(--font-body); font-size: .875rem; letter-spacing: .04em;
}
.bar__btn:active { transform: scale(.97); }

/* ── A4 한 장 (가로로 눕혀 세로 쿠폰 4 × 2) ── */
.sheet {
  width: 297mm; height: 210mm;
  margin: 0 auto;
  padding: 10mm;
  background: var(--paper);
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-auto-rows: minmax(0, 1fr);
  gap: 0;
}

/* ── 쿠폰 한 칸 ── */
.coupon {
  position: relative;
  padding: 10mm 7mm;
  overflow: hidden;
  display: grid; align-content: center; justify-items: center;
  gap: 2.6mm;
  text-align: center;
  /* 자르는 선 — 여덟 칸이 같은 크기로 잘리도록 바깥 테두리까지 두른다.
     선이 두 겹 되지 않게, 안쪽 경계는 왼쪽·위쪽 칸이 한 번만 그린다. */
  border-right: 1px dashed var(--line);
  border-bottom: 1px dashed var(--line);
}
.coupon:nth-child(4n + 1) { border-left: 1px dashed var(--line); }
.coupon:nth-child(-n + 4)  { border-top: 1px dashed var(--line); }

.coupon__eyebrow {
  font-family: var(--font-display);
  font-size: 7.5pt; letter-spacing: .28em;
  color: var(--ink-faint);
}
.coupon__seal {
  position: relative;
  width: 13mm; height: 13mm;
  display: grid; place-content: center;
  color: var(--seal-ink);
  transform: rotate(-7deg);
  font-family: var(--font-display);
  font-size: 11pt; line-height: 1.15; letter-spacing: .04em;
  margin-bottom: .8mm;
}
.coupon__seal svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.coupon__seal span { position: relative; }
.coupon__seal small { display: block; font-size: 4.2pt; letter-spacing: .2em; opacity: .85; }
.coupon__title {
  font-family: var(--font-display);
  font-size: 17pt; letter-spacing: .1em;
  color: var(--ink); line-height: 1.2;
}
.coupon__rule { width: 0; height: 6mm; border-left: 1px solid var(--line); }
.coupon__msg {
  font-family: var(--font-display);
  font-size: 9.5pt; line-height: 1.9; color: var(--ink-soft);
}
.coupon__band {
  display: flex; gap: 2px; margin-top: 1mm;
}
.coupon__band i { width: 8mm; height: 0; border-top: 2px solid; border-radius: 2px; }
.coupon__band i:nth-child(1) { border-top-color: #D9707F; }
.coupon__band i:nth-child(2) { border-top-color: #E8B36B; }
.coupon__band i:nth-child(3) { border-top-color: #8FB98A; }
.coupon__band i:nth-child(4) { border-top-color: #7FA3C4; }
.coupon__band i:nth-child(5) { border-top-color: #A98BB8; }

/* ── 인쇄 ── */
@page { size: A4 landscape; margin: 0; }
@media print {
  body { padding: 0; background: #fff; }
  .bar { display: none; }
  .sheet {
    width: 297mm; height: 210mm; margin: 0;
    box-shadow: none;
    break-inside: avoid;
  }
  .coupon { break-inside: avoid; }
  /* 휴대폰 인쇄 대화상자에는 '배경 그래픽' 항목이 없고 기본이 '끔'입니다.
     낙관과 색동 띠는 위에서 배경이 아닌 도형·테두리로 그렸고, 여기서 한 번 더 못을 박습니다. */
  .coupon__seal svg, .coupon__band i {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
}
@media screen {
  .sheet { box-shadow: 0 10px 40px -18px rgba(0,0,0,.4); }
}

/* 화면이 좁을 때 미리보기가 잘리지 않도록 */
@media screen and (max-width: 317mm) {
  body { padding: 16px 0 48px; }
  .bar { max-width: none; margin: 0 12px 16px; }
  .sheet { transform-origin: top center; }
}
</style>
</head>
<body>

<div class="bar">
  <p>
    <b>A4 한 장(가로)에 여덟 장</b>, 쿠폰 하나는 69 × 95mm 세로 카드입니다. 오른쪽 버튼으로 인쇄하시고, 점선을 따라 자르세요.<br />
    인쇄 설정에서 <b>용지 방향 가로</b>와 <b>배율 100%</b>만 확인해 주세요. 낙관과 색동 띠는 '배경 그래픽' 설정과 상관없이 찍히므로, 휴대폰에서 인쇄하셔도 됩니다.
  </p>
  <button class="bar__btn" type="button" onclick="window.print()">인쇄하기</button>
</div>

<div class="sheet" id="sheet"></div>

<script>
/* ══════════════════════════════════════════════════════
   ▼▼▼ 여기만 고치면 됩니다 ▼▼▼
   ══════════════════════════════════════════════════════ */
const COUPON = {
  eyebrow: "루나의 첫 번째 생일",
  title:   "행운상",
  msg:     "오늘의 행운을<br />잡으셨습니다",
  perPage: 8            // 한 장에 몇 칸 (한 줄이 4칸이므로 4의 배수로)
};
/* ══════════════════════════════════════════════════════
   ▲▲▲ 여기까지 ▲▲▲
   ══════════════════════════════════════════════════════ */

document.getElementById("sheet").innerHTML = Array.from({ length: COUPON.perPage }, () => `
  <div class="coupon">
    <p class="coupon__eyebrow">${COUPON.eyebrow}</p>
    <div class="coupon__seal">
      <svg viewBox="0 0 40 40" preserveAspectRatio="none" aria-hidden="true"><rect width="40" height="40" rx="1.6" fill="#B93A50" /></svg>
      <span>돌<small>첫돌</small></span>
    </div>
    <p class="coupon__title">${COUPON.title}</p>
    <div class="coupon__rule"></div>
    <p class="coupon__msg">${COUPON.msg}</p>
    <div class="coupon__band"><i></i><i></i><i></i><i></i><i></i></div>
  </div>`).join("");
</script>

</body>
</html>
